[project]
name = "chembook3d"
version = "0.0.1"
description = "Local-first notebook for computational chemistry mechanism investigations"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncssh>=2.24.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.20,<3",
    "morfeus-ml>=0.8,<0.9",
    "numpy>=2",
    "platformdirs>=4.12.1",
    "pywinpty>=2.0.14 ; sys_platform == 'win32'",
    "rdkit>=2025.9",
    "scipy>=1.11",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
chembook3d = "chembook3d.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "geometric>=1.1",
    "httpx2>=2.13.1",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chembook3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after 2 minutes prints every thread's traceback (it is not stopped).
faulthandler_timeout = 120

[tool.coverage.run]
# Not run in CI. `uv run coverage run -m pytest -W error -n auto`, then
# `uv run python scripts/coverage_combine.py` and `uv run coverage report` (docs/architecture.md,
# Tests). "subprocess" also measures the processes the tests start: the pytest-xdist workers, the
# Saga keeper (remote/keeper.py) and the local worker, which runs from a copy of local_worker.py
# in its job folder (hence the second pattern; the combine script counts it as local_worker.py).
include = ["*/src/chembook3d/*", "*/local-jobs/*/worker.py"]
patch = ["subprocess"]
parallel = true

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/reference holds Jonas's thermochemistry script verbatim; it is a test oracle, not app code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
