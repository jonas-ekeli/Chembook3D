[project]
name = "chembook3d"
version = "0.0.1"
description = "Local-first notebook for computational chemistry mechanism investigations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115",
    "morfeus-ml>=0.8,<0.9",
    "numpy>=2",
    "platformdirs>=4.12.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.30",
]

[project.scripts]
chembook3d = "chembook3d.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chembook3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/reference holds Jonas's thermochemistry script verbatim; it is a test oracle, not app code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
