# The workflow's actions are pinned to commit SHAs; Dependabot proposes the update when an
# action releases a new version (one grouped pull request a week at most).
# The Python packages (uv.lock) and the frontend's (frontend/package-lock.json) are proposed
# weekly too: minor and patch updates together in one pull request, major updates together in
# another, so each ecosystem opens two at most.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
