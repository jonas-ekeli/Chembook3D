name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for its older commit; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # The required checks are named "Backend (ubuntu-latest)" and "Backend (windows-latest)":
    # they use .python-version (3.11, the oldest supported). The include adds a third job on
    # Python 3.13, named "Backend (ubuntu-latest, Python 3.13)", that is not required.
    name: Backend (${{ matrix.os }}${{ matrix.python && format(', Python {0}', matrix.python) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: [""]
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}  # empty: .python-version
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # pytest-xdist: one worker per CPU; the 25 slowest tests are listed at the end.
      - run: uv run pytest -W error -n auto --durations=25
        env:
          CHEMBOOK3D_SLOW_REQUESTS: "2"  # print requests slower than 2 s (app.SlowRequests)

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The unit tests (frontend/tests), with Node's own line and branch coverage of src/ in the log.
      - run: npm run test:coverage
      - run: npm run build

  # Known advisories in the locked Python packages (uv.lock, every group) and the frontend's
  # runtime packages. Not a required check, so an advisory published today does not block
  # unrelated pull requests; fix it in a pull request of its own.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: pip-audit
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  ui:
    name: UI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The same build command the README gives for every platform.
      - run: uv run python scripts/build_frontend.py
      # Chromium is kept between runs for each Playwright version (the download took ~4 min on
      # Windows); `install` then only adds what is missing, and the Linux system libraries.
      - name: Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CHEMBOOK3D_SLOW_REQUESTS: "2"  # the backend prints requests slower than 2 s
      - name: Show page state of failed UI tests
        if: failure()
        shell: bash
        run: find frontend/test-results -name error-context.md -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: frontend/playwright-report
          retention-days: 7

  # T-OPS-01: zip an investigation on each OS, then open it on the other one.
  portability-create:
    name: Portability, create (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CHEMBOOK3D_CONFIG_DIR: ${{ github.workspace }}/.ci-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run python -m tests.portability create investigation-${{ runner.os }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: investigation-${{ runner.os }}
          path: investigation-${{ runner.os }}.zip
          retention-days: 1

  portability-open:
    name: Portability, open ${{ matrix.from }} zip on ${{ matrix.os }}
    needs: portability-create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            from: Windows
          - os: windows-latest
            from: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CHEMBOOK3D_CONFIG_DIR: ${{ github.workspace }}/.ci-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: investigation-${{ matrix.from }}
      - run: uv run python -m tests.portability check investigation-${{ matrix.from }}.zip

  # D213, T-LOC-05: the real local tools (Psi4, tblite, geomeTRIC from conda-forge), installed as
  # the app installs them, and a GFN2-xTB refine. Not a required check until it has proved stable.
  local-tools:
    name: Local tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run python -m chembook3d.local_tools install
        env:
          CHEMBOOK3D_TOOLS_DIR: ${{ runner.temp }}/chembook3d-tools
      - run: uv run python -m chembook3d.local_tools install-gxtb
        env:
          CHEMBOOK3D_TOOLS_DIR: ${{ runner.temp }}/chembook3d-tools
      - run: uv run pytest -W error tests/test_local_jobs.py tests/test_local_oniom.py tests/test_local_ts.py tests/test_local_gxtb.py tests/test_local_scan.py
        env:
          CHEMBOOK3D_TOOLS_DIR: ${{ runner.temp }}/chembook3d-tools
          CHEMBOOK3D_REAL_TOOLS: "1"
