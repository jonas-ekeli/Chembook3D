name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -W error

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  ui:
    name: UI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The same build command the README gives for every platform.
      - run: uv run python scripts/build_frontend.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Show page state of failed UI tests
        if: failure()
        shell: bash
        run: find frontend/test-results -name error-context.md -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: frontend/playwright-report
          retention-days: 7

  # T-OPS-01: zip an investigation on each OS, then open it on the other one.
  portability-create:
    name: Portability, create (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CHEMBOOK3D_CONFIG_DIR: ${{ github.workspace }}/.ci-config
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m tests.portability create investigation-${{ runner.os }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: investigation-${{ runner.os }}
          path: investigation-${{ runner.os }}.zip
          retention-days: 1

  portability-open:
    name: Portability, open ${{ matrix.from }} zip on ${{ matrix.os }}
    needs: portability-create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            from: Windows
          - os: windows-latest
            from: Linux
    runs-on: ${{ matrix.os }}
    env:
      CHEMBOOK3D_CONFIG_DIR: ${{ github.workspace }}/.ci-config
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: investigation-${{ matrix.from }}
      - run: uv run python -m tests.portability check investigation-${{ matrix.from }}.zip

  # D213, T-LOC-05: the real local tools (Psi4, tblite, geomeTRIC from conda-forge), installed as
  # the app installs them, and a GFN2-xTB refine. Not a required check until it has proved stable.
  local-tools:
    name: Local tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m chembook3d.local_tools install
        env:
          CHEMBOOK3D_TOOLS_DIR: ${{ runner.temp }}/chembook3d-tools
      - run: uv run python -m chembook3d.local_tools install-gxtb
        env:
          CHEMBOOK3D_TOOLS_DIR: ${{ runner.temp }}/chembook3d-tools
      - run: uv run pytest -W error tests/test_local_jobs.py tests/test_local_oniom.py tests/test_local_ts.py tests/test_local_gxtb.py tests/test_local_scan.py
        env:
          CHEMBOOK3D_TOOLS_DIR: ${{ runner.temp }}/chembook3d-tools
          CHEMBOOK3D_REAL_TOOLS: "1"
